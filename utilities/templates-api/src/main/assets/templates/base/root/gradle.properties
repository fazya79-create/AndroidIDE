# Project-wide Gradle settings.
#
# Tuned for a phone running Gradle inside a proot rootfs, not a desktop.
#
# Memory: 512m is deliberate. On a 3-4 GB device a larger heap does not make the build faster — the
# daemon, the Kotlin compiler and the IDE itself compete for the same RAM, and once the system
# starts swapping every phase slows down. Metaspace is capped separately because AGP loads a large
# number of classes. SerialGC avoids the extra GC threads a parallel collector starts.
org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC -Dfile.encoding=UTF-8
# Keep the daemon alive between builds; restarting it costs a full JVM warm-up each time.
org.gradle.daemon=true
org.gradle.caching=true
# One worker. Parallel workers each take their own heap, which on this much RAM means swapping
# rather than speedup.
org.gradle.workers.max=1
org.gradle.parallel=false
# Skips the whole configuration phase on subsequent builds, which is what makes "preparing" slow.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
# Run the Kotlin compiler inside the Gradle daemon instead of forking a second JVM. A separate
# Kotlin daemon doubles peak memory, and under proot the extra process is expensive to start.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app"s APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
