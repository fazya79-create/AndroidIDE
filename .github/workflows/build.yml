name: Build

on:
  push:
    branches: [ "dev", "main" ]
    paths-ignore:
      - '**.md'
      - 'fastlane/**'
  workflow_dispatch: { }

# A new push makes the in-flight build obsolete; cancelling it frees the runner immediately
# instead of queueing behind a result nobody will look at.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  BUILD_JAVA_VERSION: '17'
  BUILD_JAVA_DIST: 'temurin'
  # Parallel + caching + configuration cache are the three biggest wins on a 4-core free runner.
  # Kotlin's daemon gets its own heap; keeping it below the runner's 16 GB avoids swapping.
  GRADLE_OPTS: >-
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true
    -Dorg.gradle.configureondemand=true
    -Dorg.gradle.workers.max=4
    -Dkotlin.incremental=false
    -Dkotlin.compiler.execution.strategy=in-process

jobs:
  build_apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          # Only the tip is needed; the full history was costing a large clone for nothing.
          fetch-depth: 1

      - name: Set up JDK ${{ env.BUILD_JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.BUILD_JAVA_VERSION }}
          distribution: ${{ env.BUILD_JAVA_DIST }}

      - name: Change Gradle wrapper permissions
        run: chmod +x ./gradlew

      # gradle-build-action understands Gradle's cache layout: it saves the configuration cache and
      # build cache, and only writes a new entry when something actually changed. That is a large
      # improvement over a plain actions/cache of ~/.gradle, which restored 52s of files every run.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-home-cache-cleanup: true

      - name: Assemble release APK
        env:
          IDE_SIGNING_KEY_BIN: ${{ secrets.IDE_SIGNING_KEY_BIN }}
          IDE_SIGNING_ALIAS: ${{ secrets.IDE_SIGNING_ALIAS }}
          IDE_SIGNING_STORE_PASS: ${{ secrets.IDE_SIGNING_STORE_PASS }}
          IDE_SIGNING_KEY_PASS: ${{ secrets.IDE_SIGNING_KEY_PASS }}
        run: ./gradlew :core:app:assembleRelease --build-cache

      - name: Verify the APK is signed with the release key
        run: |
          apk=core/app/build/outputs/apk/release/app-arm64-v8a-release.apk
          test -f "$apk"
          apksigner=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort | tail -1)
          echo "using $apksigner"
          "$apksigner" verify --print-certs "$apk" | tee /tmp/certs.txt
          grep -q 'AndroidIDE Fork' /tmp/certs.txt

      - name: Upload arm64-v8a release APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64-v8a-release
          path: core/app/build/outputs/apk/release/app-arm64-v8a-release.apk
          if-no-files-found: error
          # The APK is only needed until it has been installed and tested.
          retention-days: 7
          compression-level: 0
