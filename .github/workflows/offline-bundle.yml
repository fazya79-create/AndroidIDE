name: Offline bundle

# Harvests every dependency a generated project needs into a Maven repository, so the first
# on-device build resolves from disk instead of spending ~20 minutes on network round trips.
#
# The pinned AGP/Gradle/Kotlin trio below MUST match utilities/templates-api/.../constants.kt.
# Re-run this workflow and bump OfflineBundle.VERSION whenever any of them changes.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish the bundle under'
        required: true
        default: 'offline-bundle-v5'

permissions:
  contents: write

env:
  # Must match the version baked into the APK's init script (see ProjectConfig.downloadVersion).
  IDE_PLUGIN_VERSION: '2.7.1-beta'
  AGP_VERSION: '8.5.0'
  GRADLE_VERSION: '8.14.3'
  KOTLIN_VERSION: '1.9.22'
  COMPOSE_COMPILER_VERSION: '1.5.10'
  COMPILE_SDK: '33'
  MIN_SDK: '21'
  TARGET_SDK: '33'
  BUILD_TOOLS_VERSION: '33.0.1'

jobs:
  harvest:
    name: Harvest dependency repository
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Assert the pins match the app's constants
        run: python3 .github/scripts/check_version_pins.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the platform the template compiles against
        run: |
          sdkmanager "platforms;android-${COMPILE_SDK}" "build-tools;${BUILD_TOOLS_VERSION}" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Generate a template project that mirrors the IDE's own template
        run: |
          mkdir -p probe/app/src/main/java/com/example/probe
          mkdir -p probe/app/src/main/res/values

          cat > probe/settings.gradle.kts <<EOF
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "probe"
          include(":app")
          EOF

          cat > probe/build.gradle.kts <<EOF
          plugins {
              id("com.android.application") version "${AGP_VERSION}" apply false
              id("com.android.library") version "${AGP_VERSION}" apply false
              id("org.jetbrains.kotlin.android") version "${KOTLIN_VERSION}" apply false
          }
          EOF

          # Both view-based and Compose projects must resolve, so the bundle covers either choice.
          cat > probe/app/build.gradle.kts <<EOF
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.probe"
              compileSdk = ${COMPILE_SDK}

              defaultConfig {
                  applicationId = "com.example.probe"
                  minSdk = ${MIN_SDK}
                  targetSdk = ${TARGET_SDK}
                  versionCode = 1
                  versionName = "1.0"
                  vectorDrawables { useSupportLibrary = true }
                  testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions { jvmTarget = "17" }

              buildTypes {
                  release {
                      isMinifyEnabled = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }

              buildFeatures {
                  viewBinding = true
                  compose = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "${COMPOSE_COMPILER_VERSION}"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.10.1")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.9.0")
              implementation("androidx.constraintlayout:constraintlayout:2.1.4")
              implementation("androidx.activity:activity-compose:1.7.2")
              implementation(platform("androidx.compose:compose-bom:2023.06.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              debugImplementation("androidx.compose.ui:ui-tooling")
              testImplementation("junit:junit:4.13.2")
              androidTestImplementation("androidx.test.ext:junit:1.1.5")
              androidTestImplementation("androidx.test.espresso:espresso-core:3.5.1")
              androidTestImplementation(platform("androidx.compose:compose-bom:2023.06.01"))
              androidTestImplementation("androidx.compose.ui:ui-test-junit4")
          }
          EOF

          cat > probe/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="probe" android:theme="@style/Theme.AppCompat" />
          </manifest>
          EOF

          cat > probe/app/src/main/java/com/example/probe/MainActivity.kt <<'EOF'
          package com.example.probe

          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
              }
          }
          EOF

          cat > probe/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

      - name: Resolve every configuration into an isolated Gradle home
        working-directory: probe
        run: |
          curl -sSLo gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q gradle.zip
          GRADLE="$PWD/gradle-${GRADLE_VERSION}/bin/gradle"

          # A build only downloads what its tasks need, so resolving the classpaths explicitly is
          # what makes the bundle complete. `assemble` on top pulls in the compiler, R8, lint and
          # aapt2 workers that dependency resolution alone never touches.
          cat >> app/build.gradle.kts <<'EOF'

          tasks.register("resolveEverything") {
              doLast {
                  configurations
                      .filter { it.isCanBeResolved }
                      .forEach { configuration ->
                          try {
                              configuration.resolve()
                              logger.lifecycle("resolved ${configuration.name}")
                          } catch (e: Exception) {
                              logger.lifecycle("skipped ${configuration.name}: ${e.message}")
                          }
                      }
              }
          }
          EOF

          # Apply the IDE's init-script plugin here too: it injects logsender into every variant,
          # so resolving without it harvests a dependency set the device will never have.
          cat > harvest-ide-init.gradle <<EOF
          initscript {
              repositories {
                  mavenCentral()
                  google()
              }
              dependencies {
                  classpath 'com.itsaky.androidide:gradle-plugin:${IDE_PLUGIN_VERSION}'
              }
          }

          apply plugin: com.itsaky.androidide.gradle.AndroidIDEInitScriptPlugin
          EOF

          IDE_INIT=(--init-script harvest-ide-init.gradle -Pandroidide.logsender.isEnabled=true)

          "$GRADLE" --no-daemon --gradle-user-home "$PWD/gradle-home" "${IDE_INIT[@]}" resolveEverything
          "$GRADLE" --no-daemon --gradle-user-home "$PWD/gradle-home" "${IDE_INIT[@]}" assembleDebug assembleRelease
          "$GRADLE" --no-daemon --gradle-user-home "$PWD/gradle-home" "${IDE_INIT[@]}" lintDebug || true
          "$GRADLE" --no-daemon --gradle-user-home "$PWD/gradle-home" "${IDE_INIT[@]}" compileDebugAndroidTestKotlin || true

      - name: Harvest the IDE's own init-script classpath
        working-directory: probe
        run: |
          GRADLE="$PWD/gradle-${GRADLE_VERSION}/bin/gradle"

          # The on-device init script pulls in AndroidIDE's gradle-plugin before any project code
          # runs. Resolving it here is what stops an offline build failing with
          # "No cached version of com.itsaky.androidide:gradle-plugin available for offline mode".
          #
          # This MUST use its own Gradle home. Sharing one with the template resolution lets
          # Gradle's conflict resolution upgrade the plugin's transitive dependencies to the
          # template's versions — kotlin-stdlib 1.9.21 became 1.9.22 and was never downloaded,
          # so on device (where this classpath resolves alone) the exact version was missing.
          cat > harvest-init.gradle.kts <<EOF
          initscript {
              repositories {
                  mavenCentral()
                  google()
              }
              dependencies {
                  classpath("com.itsaky.androidide:gradle-plugin:${IDE_PLUGIN_VERSION}")
              }
          }
          EOF

          "$GRADLE" --no-daemon --gradle-user-home "$PWD/gradle-home-init" \
            --init-script harvest-init.gradle.kts help

      - name: Harvest the exact declared versions of every dependency
        working-directory: probe
        run: |
          GRADLE="$PWD/gradle-${GRADLE_VERSION}/bin/gradle"

          # Conflict resolution means the *resolved* graph is not the same as the set of versions
          # that were requested. A plugin's classpath resolves in isolation on device, so it needs
          # the versions its own metadata declares verbatim — not whatever this build upgraded them
          # to. AGP 8.5.0 for example declares kotlin-stdlib-jdk8 1.9.20 while the template uses
          # Kotlin 1.9.22, so the 1.9.20 artifacts would never be downloaded.
          python3 - <<'PY'
          import json, urllib.request

          ide = "${{ env.IDE_PLUGIN_VERSION }}"
          agp = "${{ env.AGP_VERSION }}"
          kotlin = "${{ env.KOTLIN_VERSION }}"
          compose = "${{ env.COMPOSE_COMPILER_VERSION }}"

          CENTRAL = "https://repo1.maven.org/maven2"
          GOOGLE = "https://dl.google.com/dl/android/maven2"

          # (repository, group path, artifact, version) for every root whose declared versions must
          # exist verbatim in the bundle.
          roots = [
              (CENTRAL, "com/itsaky/androidide", "gradle-plugin", ide),
              (CENTRAL, "com/itsaky/androidide", "gradle-plugin-config", ide),
              (CENTRAL, "com/itsaky/androidide", "build-info", ide),
              # The init-script plugin injects logsender into every generated project
              # ("Adding LogSender dependency ... to variant 'debug'"), so an offline build needs it
              # and its `logger` dependency even though no template declares them.
              (CENTRAL, "com/itsaky/androidide", "logsender", ide),
              (CENTRAL, "com/itsaky/androidide", "logger", ide),
              (GOOGLE, "com/android/tools/build", "gradle", agp),
              (GOOGLE, "com/android/tools/build", "gradle-api", agp),
              (CENTRAL, "org/jetbrains/kotlin", "kotlin-gradle-plugin", kotlin),
              (CENTRAL, "org/jetbrains/kotlin", "kotlin-compiler-embeddable", kotlin),
              (GOOGLE, "androidx/compose/compiler", "compiler", compose),
          ]

          coords, seen = [], set()

          def add(coord):
              if coord not in seen:
                  seen.add(coord)
                  coords.append(coord)

          for repo, group, artifact, version in roots:
              if not version:
                  continue
              add(f"{group.replace('/', '.')}:{artifact}:{version}")
              url = f"{repo}/{group}/{artifact}/{version}/{artifact}-{version}.module"
              try:
                  meta = json.load(urllib.request.urlopen(url, timeout=60))
              except Exception as exc:
                  print(f"no module metadata for {artifact} {version}: {exc}")
                  continue
              for variant in meta.get("variants", []):
                  for dep in variant.get("dependencies", []):
                      requires = dep.get("version", {}).get("requires")
                      if requires:
                          add(f"{dep['group']}:{dep['module']}:{requires}")

          with open("exact-deps.txt", "w") as handle:
              handle.write("\n".join(coords) + "\n")
          print(f"{len(coords)} declared coordinates")
          for coord in coords:
              print(" ", coord)
          PY

          mkdir -p exact
          cat > exact/settings.gradle.kts <<'EOF'
          rootProject.name = "exact"
          EOF

          # One configuration PER COORDINATE. A single shared configuration would put all of them
          # back into one graph and conflict resolution would collapse the duplicate versions we
          # are specifically trying to keep (1.9.20 and 1.9.22 side by side).
          {
            echo 'plugins { base }'
            echo 'repositories { google(); mavenCentral(); gradlePluginPortal() }'
            echo ''
            echo 'val coords = listOf('
            while read -r coord; do
              [ -z "$coord" ] && continue
              echo "    \"$coord\","
            done < exact-deps.txt
            echo ')'
            echo ''
            echo 'val fetchTasks = coords.mapIndexed { index, coord ->'
            echo '    val configuration = configurations.create("fetch$index") {'
            echo '        isTransitive = true'
            echo '        isCanBeResolved = true'
            echo '        isCanBeConsumed = false'
            echo '    }'
            echo '    dependencies.add(configuration.name, coord)'
            echo '    configuration'
            echo '}'
            echo ''
            echo 'tasks.register("fetchAll") {'
            echo '    doLast {'
            echo '        var ok = 0'
            echo '        fetchTasks.forEachIndexed { index, configuration ->'
            echo '            try {'
            echo '                configuration.resolve()'
            echo '                ok++'
            echo '            } catch (e: Exception) {'
            echo '                logger.lifecycle("could not fetch ${coords[index]}: ${e.message}")'
            echo '            }'
            echo '        }'
            echo '        logger.lifecycle("fetched $ok of ${coords.size} coordinates")'
            echo '    }'
            echo '}'
          } > exact/build.gradle.kts

          "$GRADLE" --no-daemon --gradle-user-home "$PWD/gradle-home-init" \
            -p exact fetchAll

      - name: Convert the module cache into a Maven repository layout
        run: |
          python3 - <<'PY'
          import shutil
          from pathlib import Path

          # Both Gradle homes must be merged: the template's, and the isolated one holding the
          # init-script classpath at its exact declared versions.
          caches = [
              Path("probe/gradle-home/caches/modules-2/files-2.1"),
              Path("probe/gradle-home-init/caches/modules-2/files-2.1"),
          ]
          out = Path("localMvnRepository")
          keep = {".jar", ".aar", ".pom", ".module", ".klib"}
          copied = 0

          # Cache layout: files-2.1/<group>/<artifact>/<version>/<sha1>/<file>
          # Maven layout:  <group as dirs>/<artifact>/<version>/<file>
          for cache in caches:
              if not cache.is_dir():
                  print(f"missing cache: {cache}")
                  continue
              for path in cache.rglob("*"):
                  if not path.is_file() or path.suffix.lower() not in keep:
                      continue
                  rel = path.relative_to(cache).parts
                  if len(rel) < 5:
                      continue
                  group, artifact, version = rel[0], rel[1], rel[2]
                  target = out.joinpath(*group.split("."), artifact, version, path.name)
                  if target.exists():
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(path, target)
                  copied += 1

          print(f"copied {copied} artifacts")
          if copied == 0:
              raise SystemExit("harvest produced nothing - the resolution step must have failed")
          PY

      - name: Verify a build resolves from the bundle alone
        working-directory: probe
        run: |
          GRADLE="$PWD/gradle-${GRADLE_VERSION}/bin/gradle"
          REPO="$PWD/../localMvnRepository"

          # The real test of "nothing was missed": build offline against the harvested repository
          # only, with the IDE's init script APPLIED exactly as on device. Merely putting the plugin
          # on the classpath is not enough — applying it is what injects logsender into every
          # variant, and that missing artifact is precisely what slipped through before.
          cat > verify-init.gradle <<EOF
          initscript {
              repositories {
                  maven { url '${REPO}' }
              }
              dependencies {
                  classpath 'com.itsaky.androidide:gradle-plugin:${IDE_PLUGIN_VERSION}'
              }
          }

          apply plugin: com.itsaky.androidide.gradle.AndroidIDEInitScriptPlugin

          settingsEvaluated { settings ->
              settings.pluginManagement.repositories.clear()
              settings.pluginManagement.repositories.maven { url '${REPO}' }
              settings.dependencyResolutionManagement.repositories.clear()
              settings.dependencyResolutionManagement.repositories.maven { url '${REPO}' }
          }

          allprojects {
              buildscript.repositories.clear()
              buildscript.repositories.maven { url '${REPO}' }
              repositories.clear()
              repositories.maven { url '${REPO}' }
          }
          EOF

          rm -rf gradle-home-verify
          # The same properties the IDE passes on device, so the same code paths run here.
          "$GRADLE" --no-daemon --offline \
            --gradle-user-home "$PWD/gradle-home-verify" \
            --init-script verify-init.gradle \
            -Pandroidide.logsender.isEnabled=true \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}/aapt2" \
            assembleDebug assembleRelease

      - name: Zip the repository with stored (uncompressed) entries
        run: |
          # Jars stay uncompressed so Gradle can mmap them on device; the outer zip is stored too
          # so the Brotli pass below sees the raw bytes instead of already-deflated streams.
          cd localMvnRepository
          zip -0 -q -r ../localMvnRepository.zip .
          cd ..
          ls -la localMvnRepository.zip
          du -sh localMvnRepository

      - name: Brotli-compress the archive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq brotli
          # -q 11 is the slowest/densest setting; this runs once in CI and every user pays the
          # download, so the trade is worth it. The app decompresses with commons-compress.
          brotli -q 11 -f -o localMvnRepository.zip.br localMvnRepository.zip
          raw=$(stat -c%s localMvnRepository.zip)
          comp=$(stat -c%s localMvnRepository.zip.br)
          echo "raw=$raw compressed=$comp"
          python3 -c "print(f'saved {100 - $comp * 100 / $raw:.1f}%')"

      - name: Publish checksums
        run: |
          sha256sum localMvnRepository.zip.br | tee checksums.txt

      - name: Summarize
        run: |
          {
            echo "### Offline bundle"
            echo
            echo "| item | value |"
            echo "|---|---|"
            echo "| AGP | ${AGP_VERSION} |"
            echo "| Gradle | ${GRADLE_VERSION} |"
            echo "| Kotlin | ${KOTLIN_VERSION} |"
            echo "| artifacts | $(find localMvnRepository -type f | wc -l) |"
            echo "| archive | $(du -h localMvnRepository.zip | cut -f1) |"
            echo "| download | $(du -h localMvnRepository.zip.br | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Offline dependency bundle" \
              --notes "Maven repository harvested for AGP ${AGP_VERSION}, Gradle ${GRADLE_VERSION}, Kotlin ${KOTLIN_VERSION}."

          gh release upload "$TAG" localMvnRepository.zip.br checksums.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
